services:
  db:
    image: postgres:15
    restart: unless-stopped
    container_name: nexus_erp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus_erp}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 120s
    networks: [erp_net]

  backend:
    build: ./backend
    container_name: nexus_erp_backend
    command: >
      sh -c "python scripts/wait_for_db.py &&
             python manage.py fix_migration_history &&
             python manage.py migrate &&
             python manage.py criar_usuario_inicial &&
             python manage.py runserver 0.0.0.0:8000 --noreload"
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    env_file: [.env]
    environment:
      NO_PROXY: ".fazenda.gov.br,.fazenda.sp.gov.br,.sefaz.rs.gov.br,localhost,127.0.0.1,backend,db"
      no_proxy: ".fazenda.gov.br,.fazenda.sp.gov.br,.sefaz.rs.gov.br,localhost,127.0.0.1,backend,db"
    depends_on:
      db:
        condition: service_healthy
    networks: [erp_net]

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.build
      args:
        VITE_API_URL: /api
    restart: "no"
    volumes:
      - frontend_dist:/srv/frontend
    environment:
      VITE_API_URL: /api
    networks: [erp_net]

  caddy:
    image: caddy:2
    container_name: nexus_erp_caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - frontend_dist:/srv/frontend:ro
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    networks: [erp_net]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  frontend_dist:

networks:
  erp_net:
    name: nexus-erp-prod_default
